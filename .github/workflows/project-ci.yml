name: 测试与站点打包

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
  workflow_call:
    inputs:
      source-ref:
        type: string
        default: ""
      version:
        type: string
        default: ""
      artifact-name:
        type: string
        default: website-package

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn run lint
      - run: yarn run format:check
      - name: 单元测试与覆盖率
        shell: bash
        run: |
          set -o pipefail
          yarn run test:coverage 2>&1 | tee test-results.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: javascript-node-${{ matrix.node }}
          path: test-results.txt
          retention-days: 7

  tooling:
    name: 构建与提交工具测试
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: python -B -m unittest discover -s tests/tooling -p 'test_*.py' -v

  html:
    name: HTML 与站内链接
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      - uses: anishathalye/proof-html@f060b7619c2410bd85d970459a60ef431cf47ed5 # v2
        with:
          directory: www/
          disable_external: true

  browser:
    name: Firefox 页面回归
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps firefox
      - name: 页面与模拟服务回归
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          python -m pytest tests/test_spa.py tests/test_services.py \
            --simplehttpserver-directory ./ --junitxml=test-results/firefox.xml \
            2>&1 | tee test-results/firefox.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: firefox-results
          path: test-results/
          retention-days: 7

  package:
    name: 生成可部署站点包
    needs: [javascript, tooling, html, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: 构建网站 ZIP 与校验文件
        env:
          SITE_VERSION: ${{ inputs.version }}
        run: python scripts/build_site.py --version "$SITE_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.artifact-name || 'website-package' }}
          path: |
            build/firmware-selector-*.zip
            build/firmware-selector-*.zip.sha256
            build/build-info.json
          if-no-files-found: error
          retention-days: 14
